<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=circle">
<title>Falls Glade — isometric pixel loop</title>
<style>
  :root { --ink: #1c1b19; --muted: #8b877f; --paper: #fff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 13px/1.35 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; image-rendering: pixelated; outline: none; }
  #top { position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); pointer-events: none; }
  #top b { font-size: 13px; font-weight: 600; }
  #top span { color: var(--muted); }
  #bottom { position: fixed; left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; gap: 16px; align-items: center; }
  #caption { color: var(--muted); }
  button { font: inherit; color: var(--muted); background: none; border: 0; padding: 10px; margin: -10px; cursor: pointer; }
  button:hover, button:focus-visible { color: var(--ink); }
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="Seamless pixel loop: waterfall glade with a barking dog."></canvas></div>
<div id="top"><b>falls glade</b> <span>· 8s seamless loop</span></div>
<div id="bottom">
  <div id="caption">falls · pond · pines · barking dog</div>
  <div><button id="png" type="button">png</button> <button id="rec" type="button">record webm</button></div>
</div>
<script>window.PP_LOOP = { originY: 12, shadowX: 1.3, shadowY: -0.12, loopLen: 8 };</script>
<script src="../engine-loop.js"></script>
<script>
'use strict';
// Falls glade: waterfall + pond + pines/bamboo + barking dog + petals.
// Proves the any-subject kit: terrain, water, vegetation, creature, weather.
const HALF_X = 12, HALF_Y = 8;
const POND = { x: 2.5, y: 0.8, rx: 4.2, ry: 2.6 };
const FALLS = { x: -1.2, y: -0.6, top: 3.4, base: 0.1 };
const DOG_PAL = { coat: [150, 110, 72], snout: [210, 190, 170], ear: [100, 72, 48] };
const G = { time: 0 };
let flow = null;
const birds = [{ x0: -14, x1: 14, y: -4, z: 6, ph: 0 }, { x0: -14, x1: 14, y: -5, z: 6.6, ph: 1 }];
const petals = [];
for (let k = 0; k < 14; k++) petals.push({ x: (hash(k, 5) - 0.5) * 16, y0: -6, y1: 6, span: 12, z: 2 + hash(k, 6) * 2, ph: hash(k, 7) * 6.28 });

function pondEdge(x, y) {
  return Math.hypot((x - POND.x) / POND.rx, (y - POND.y) / POND.ry) + (noise(x * 0.45, y * 0.45) - 0.5) * 0.14;
}
function groundColor(x, y, ix, iy, i) {
  const edge = Math.pow(Math.pow(Math.abs(x) / HALF_X, 4) + Math.pow(Math.abs(y) / HALF_Y, 4), 0.25)
    + (noise(x * 1.3, y * 1.3) - 0.5) * 0.12;
  if (edge > 1.04) return 0;
  if (edge > 0.94 && hash(ix, iy) < (edge - 0.94) / 0.1) return 0;
  if (pondEdge(x, y) < 1) {
    kinds[i] = LOOP_KINDS.WATER;
    const v = pondEdge(x, y) * pondEdge(x, y) * 0.9 + (noise(x * 0.6, y * 0.35) - 0.5) * 0.25;
    return rgb(...[[44, 104, 112], [52, 116, 122], [62, 130, 132], [78, 146, 142]][clamp(Math.floor(v * 5 + (bayerAt(ix, iy) - 0.5) * 0.6), 0, 3)]);
  }
  kinds[i] = LOOP_KINDS.GRASS;
  const t = noise(x * 0.9, y * 0.9) * 1.15 + (hash(ix, iy) - 0.5) * 0.55 - 0.08;
  return rgb(...GRASS[clamp(Math.floor(t * 4.2), 0, 3)]);
}

function bake() {
  zb.fill(-1e9);
  pix.fill(rgb(255, 255, 255));
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const g = unproject(ix + 0.5, iy + 0.5), i = iy * W + ix;
    const c = groundColor(g.x, g.y, ix, iy, i);
    if (!c) continue;
    pix[i] = c; ground[i] = 1;
    zb[i] = (g.x + g.y) / R2 * COS;
  }
  groundZ.set(zb);
  growGrass();
  // rock stack the falls pour over (3 tiers, anchored to each other + ground)
  box(-2.4, -1.6, 0, -0.2, 0.4, 1.2, [150, 148, 142], 3);
  box(-2.1, -1.3, 1.2, -0.5, 0.1, 2.2, [162, 160, 152], 5);
  box(-1.9, -1.1, 2.2, -0.7, -0.1, 3.2, [174, 172, 162], 8);
  castShadow(-1.3, -0.6, 3.2, 1.4);
  growPine(-6.5, -3.5, 1.1, 11);
  growPine(6.8, -2.5, 0.85, 23);
  growBamboo(-5.5, 3.2, 7, 0.9, 31);
  growBush(5.6, 3.4, 0.55, [92, 128, 72], 41);
  growFlowers(-4, 1.5, 3, 2, 22, 51);
  growReeds(2.5, 3.2, 9, 61);
  flow = makeFlow({ x0: -2, x1: 6.5, y0: -1.5, y1: 3, count: 90, seed: 71 });
  bakeOcclusion();
  staticShadow.set(shadowMask);
  applyShadows(groundZ);
  bakedPix.set(pix); bakedZ.set(zb);
}

function draw() {
  pix.set(bakedPix); zb.set(bakedZ); pendingShadows.length = 0;
  const t = G.time, wt = windTime(t);
  setLoopTime(t);
  const beat = Math.floor(((t % LOOP_LEN) / LOOP_LEN) * 4);
  dog(-0.5, 3.6, -2.2, { sit: true, wag: true, barkBeat: 1 }, DOG_PAL, dynamicAdd);
  drawLeaves(wt); drawTufts(wt);
  drawFlow(wt, flow, 'x');
  drawFall(FALLS.x, FALLS.y, FALLS.top, FALLS.base, wt, 1.1);
  drawSmoke(wt, FALLS.x, FALLS.y, 0.4, 1.2); // mist at the base
  drawBirds(wt, birds);
  drawPetals(wt, petals);
  flushShadows(); applyShadows(bakedZ); shadeEdges();
  if (beat === 1) { // bark echo dust at the dog's feet
    const p = project(-0.5, 3.6, 0.1);
    drawDots([[p.sx - 2, p.sy], [p.sx + 2, p.sy]], rgb(220, 210, 200));
  }
  ctx.putImageData(image, 0, 0);
}

function update(dt) { G.time += dt; }

const recBtn = document.getElementById('rec');
let recorder = null;
recBtn.addEventListener('click', () => {
  if (recorder) { recorder.stop(); return; }
  const stream = canvas.captureStream(30);
  const chunks = [];
  recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'falls-glade-loop.webm'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    recorder = null; recBtn.textContent = 'record webm';
  };
  recorder.start();
  recBtn.textContent = 'recording… (one loop)';
  setTimeout(() => { if (recorder && recorder.state !== 'inactive') recorder.stop(); }, LOOP_LEN * 1000);
});
document.getElementById('png').addEventListener('click', () => {
  const out = document.createElement('canvas');
  out.width = W * 3; out.height = H * 3;
  const o = out.getContext('2d');
  o.imageSmoothingEnabled = false;
  o.drawImage(canvas, 0, 0, out.width, out.height);
  const a = document.createElement('a');
  a.download = 'falls-glade.png';
  a.href = out.toDataURL(); a.click();
});

addEventListener('resize', fit);
fit(); bake(); draw();
let last = performance.now();
function frame(now) {
  update(Math.min(0.04, (now - last) / 1000));
  last = now; draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__loop = { G, LOOP_LEN, step(dt, skipDraw) { update(dt); if (!skipDraw) draw(); } };
</script>
</body>
</html>
