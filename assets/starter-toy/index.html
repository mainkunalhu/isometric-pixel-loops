<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=circle">
<title>Lantern Keeper — isometric pixel toy</title>
<style>
  :root { --ink: #1c1b19; --muted: #8b877f; --paper: #fff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 13px/1.35 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; cursor: pointer; outline: none; }
  #top { position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); pointer-events: none; }
  #top b { font-size: 13px; font-weight: 600; }
  #top span { color: var(--muted); }
  #bottom { position: fixed; left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; gap: 16px; align-items: center; }
  #line { color: var(--muted); transition: opacity .22s ease; }
  #hint { color: var(--muted); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" tabindex="0" aria-label="A paper lantern on a path. Walk the traveler to it with the arrow keys or by clicking."></canvas></div>
<div id="top"><b>lantern keeper</b> <span>· walk-to-trigger toy</span></div>
<div id="bottom">
  <div id="line" role="status" aria-live="polite"></div>
  <div id="hint">← → to walk</div>
</div>
<script>window.PP_LOOP = { originY: 10, shadowX: 1.3, shadowY: -0.12, loopLen: 8 }; window.PP_TOY = true;</script>
<script src="../engine-loop.js"></script>
<script>
'use strict';
// Lantern keeper: the toy track. One input (walk), one verb (approach).
// Reach the lantern → it kindles, speaks two lines, points you on → walk away to release.
const HALF_X = 12, HALF_Y = 8;
const SPOT = { x: 2.5, y: 0.5 };
const TRAVELER = { shirt: [90, 128, 150], stripe: [90, 128, 150], legs: [52, 52, 60], hair: [40, 30, 26], skin: [214, 162, 124] };
const ACTS = {
  hidden:   { strip: ['dim'], fps: 1, loop: true },
  appear:   { strip: ['dim', 'kindle1', 'kindle2', 'lit'], fps: 4, loop: false },
  greet:    { strip: ['lit', 'sway'], fps: 2, loop: true },
  point:    { strip: ['lit', 'bright'], fps: 3, loop: false },
  farewell: { strip: ['bright', 'kindle1', 'dim'], fps: 4, loop: false },
};
const LINES = {
  greet: [{ at: 0.3, text: 'Traveler. The path is safe tonight.' }, { at: 2.4, text: 'Walk on — I will keep the light.' }],
};
const LINE_SECONDS = 2.1;
const G = { time: 0, act: 'hidden', actT: 0, vis: 0, locked: false, met: false,
  man: { x: -7, tx: -7, walking: false }, script: [], scriptStart: 0, line: null };
const lineEl = document.getElementById('line');
const enter = act => { G.act = act; G.actT = 0; };
const actDone = () => { const a = ACTS[G.act]; return !a.loop && G.actT >= a.strip.length / a.fps; };
const say = lines => { G.script = lines; G.scriptStart = G.time; };

function groundColor(x, y, ix, iy, i) {
  const edge = Math.pow(Math.pow(Math.abs(x) / HALF_X, 4) + Math.pow(Math.abs(y) / HALF_Y, 4), 0.25)
    + (noise(x * 1.3, y * 1.3) - 0.5) * 0.12;
  if (edge > 1.04) return 0;
  if (edge > 0.94 && hash(ix, iy) < (edge - 0.94) / 0.1) return 0;
  kinds[i] = LOOP_KINDS.GRASS;
  if (Math.abs(y - SPOT.y) < 1.4) { // worn path along the walk axis
    kinds[i] = LOOP_KINDS.SAND;
    return rgb(...PAL.sand[clamp(Math.floor((noise(x * 0.9, y * 0.9) * 1.2 + (bayerAt(ix, iy) - 0.5) * 0.5) * 4), 0, 3)]);
  }
  const t = noise(x * 0.9, y * 0.9) * 1.15 + (hash(ix, iy) - 0.5) * 0.55 - 0.08;
  return rgb(...GRASS[clamp(Math.floor(t * 4.2), 0, 3)]);
}

function bake() {
  zb.fill(-1e9);
  pix.fill(rgb(255, 255, 255));
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const g = unproject(ix + 0.5, iy + 0.5), i = iy * W + ix;
    const c = groundColor(g.x, g.y, ix, iy, i);
    if (!c) continue;
    pix[i] = c; ground[i] = 1;
    zb[i] = (g.x + g.y) / R2 * COS;
  }
  groundZ.set(zb);
  growGrass();
  // lantern post: two-point anchor (ground + arm), shade touches the path
  capsule([SPOT.x + 0.8, SPOT.y - 0.8, 0], [SPOT.x + 0.8, SPOT.y - 0.8, 3.0], 0.08, 0.08, () => [80, 64, 48], 'solid');
  capsule([SPOT.x + 0.8, SPOT.y - 0.8, 3.0], [SPOT.x, SPOT.y, 2.9], 0.05, 0.05, () => [80, 64, 48], 'solid');
  castShadow(SPOT.x + 0.8, SPOT.y - 0.8, 3, 0.35);
  growBush(SPOT.x - 2.2, SPOT.y + 2.0, 0.55, [92, 128, 72], 3);
  growFlowers(-4, -2, 3, 2, 18, 9);
  bakeOcclusion();
  staticShadow.set(shadowMask);
  applyShadows(groundZ);
  bakedPix.set(pix); bakedZ.set(zb);
}

function update(dt) {
  G.time += dt; G.actT += dt;
  const M = G.man;
  const dx = M.tx - M.x;
  if (Math.abs(dx) > 0.03 && !G.locked) {
    const step = Math.min(Math.abs(dx), 1.8 * dt);
    M.x += Math.sign(dx) * step;
    M.walking = true;
  } else M.walking = false;
  const far = Math.abs(M.x - SPOT.x);
  // performance: reach spot → kindle → greet (locked) → point → release → walk away → dim
  if (G.act === 'hidden' && !G.met && far < 1.2) {
    G.locked = true; M.tx = SPOT.x - 0.9; enter('appear');
  } else if (G.act === 'appear' && actDone()) { enter('greet'); say(LINES.greet); }
  else if (G.act === 'greet' && G.locked && G.time - G.scriptStart > 4.6) { enter('point'); }
  else if (G.act === 'point' && actDone()) { G.locked = false; G.met = true; enter('greet'); }
  else if (G.met && far > 6) { enter('farewell'); }
  else if (G.act === 'farewell' && actDone()) { enter('hidden'); G.met = false; G.script = []; }
  const want = (G.act === 'hidden' || G.act === 'farewell') ? 0 : 1;
  G.vis = clamp(G.vis + (want - G.vis) * Math.min(1, dt * 1.2), 0, 1);
  const t = G.time - G.scriptStart;
  const found = G.script.find(l => t >= l.at && t < l.at + LINE_SECONDS);
  const text = found ? found.text : null;
  if (text !== G.line) { G.line = text; lineEl.textContent = text || ''; lineEl.style.opacity = text ? 1 : 0; }
}

function draw() {
  pix.set(bakedPix); zb.set(bakedZ); pendingShadows.length = 0;
  const t = G.time, wt = windTime(t);
  setLoopTime(t);
  const M = G.man;
  const pose = M.walking ? walkPose(t, { swing: 0.13, armSwing: 3 }) : { lean: loopSin(t) * 0.03, stance: 0.08 };
  figure(M.x, SPOT.y + 0.4, M.tx >= M.x ? 0.78 : -2.36, pose, TRAVELER, dynamicAdd);
  drawLeaves(wt); drawTufts(wt);
  flushShadows(); applyShadows(bakedZ); shadeEdges();
  // lantern: dim ember → kindled glow + halo while vis; sway on wind
  const sway = Math.sin(wt * 0.9) * 0.05;
  sphere(SPOT.x + sway, SPOT.y, 2.7, 0.2, [255, 190, 120], G.vis > 0.5 ? 'gloss' : 'rough');
  if (G.vis > 0.02) {
    glowDots(SPOT.x, SPOT.y, 2.7, t, [255, 190, 120], 3, 4);
    const p = project(SPOT.x, SPOT.y, 2.7);
    drawDots([[p.sx, p.sy]], rgb(255, 250, 235));
  }
  ctx.putImageData(image, 0, 0);
}

// one input: arrows walk, click walks there; locked during the performance
const stepTo = wx => { if (!G.locked) G.man.tx = clamp(wx, -HALF_X + 1, HALF_X - 1); };
canvas.addEventListener('pointerdown', e => {
  canvas.focus({ preventScroll: true });
  const r = canvas.getBoundingClientRect();
  stepTo(unproject(((e.clientX - r.left) / r.width) * W, ((e.clientY - r.top) / r.height) * H).x);
});
canvas.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight' || e.repeat) return;
  e.preventDefault();
  stepTo(G.man.tx + (e.key === 'ArrowRight' ? 1.2 : -1.2));
});
addEventListener('resize', fit);
fit(); bake(); draw();
let last = performance.now();
function frame(now) {
  update(Math.min(0.04, (now - last) / 1000));
  last = now; draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__toy = { G, ACTS, enter, step(dt, skipDraw) { update(dt); if (!skipDraw) draw(); } };
</script>
</body>
</html>
