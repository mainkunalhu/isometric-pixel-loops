<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=circle">
<title>Street Runner — isometric pixel loop</title>
<style>
  :root { --ink: #1c1b19; --muted: #8b877f; --paper: #fff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 13px/1.35 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; image-rendering: pixelated; outline: none; }
  #top { position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); pointer-events: none; }
  #top b { font-size: 13px; font-weight: 600; }
  #top span { color: var(--muted); }
  #bottom { position: fixed; left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; gap: 16px; align-items: center; }
  #caption { color: var(--muted); }
  button { font: inherit; color: var(--muted); background: none; border: 0; padding: 10px; margin: -10px; cursor: pointer; }
  button:hover, button:focus-visible { color: var(--ink); }
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="Seamless pixel loop: headband runner crossing past a food stall."></canvas></div>
<div id="top"><b>street runner</b> <span>· 8s seamless loop</span></div>
<div id="bottom">
  <div id="caption">4-key gait · flip beats · lantern sway</div>
  <div><button id="png" type="button">png</button> <button id="rec" type="button">record webm</button></div>
</div>
<script>window.PP_LOOP = { originY: 12, shadowX: 1.3, shadowY: -0.12, loopLen: 8 };</script>
<script src="../engine-loop.js"></script>
<script>
'use strict';
// Street runner: proves walkPose gait, anchored stall, roadStripes crossing,
// headband + lagAngle tails, 4-beat choreography. Max 2 movers.
const HALF_X = 12, HALF_Y = 8;
const SPAN = 14, FLOW = SPAN / LOOP_LEN; // runner wraps exactly per loop
const STALL = { x: 3.5, y: -1.5 };
const RUNNER = { shirt: [200, 110, 50], stripe: [200, 110, 50], legs: [50, 60, 90], hair: [40, 30, 26], skin: [214, 162, 124] };
const VENDOR = { shirt: [90, 128, 150], stripe: [90, 128, 150], legs: [64, 62, 58], hair: [120, 120, 118], skin: [198, 148, 112] };
const G = { time: 0 };

function groundColor(x, y, ix, iy, i) {
  const edge = Math.pow(Math.pow(Math.abs(x) / HALF_X, 4) + Math.pow(Math.abs(y) / HALF_Y, 4), 0.25)
    + (noise(x * 1.3, y * 1.3) - 0.5) * 0.12;
  if (edge > 1.04) return 0;
  if (edge > 0.94 && hash(ix, iy) < (edge - 0.94) / 0.1) return 0;
  kinds[i] = KIND_GRASS;
  // packed-dirt town square: tight warm greys, road band painted darker below
  const onRoad = Math.abs(y - 1.5) < 1.6;
  if (onRoad) return rgb(88, 80, 88);
  const v = noise(x * 0.9, y * 0.9) * 1.15 + (hash(ix, iy) - 0.5) * 0.55 - 0.08;
  const tones = [[120, 110, 100], [132, 120, 108], [144, 130, 116], [156, 142, 126]];
  return rgb(...tones[clamp(Math.floor(v * 4.2), 0, 3)]);
}

function bake() {
  zb.fill(-1e9);
  pix.fill(rgb(255, 255, 255));
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const g = unproject(ix + 0.5, iy + 0.5), i = iy * W + ix;
    const c = groundColor(g.x, g.y, ix, iy, i);
    if (!c) continue;
    pix[i] = c; ground[i] = 1;
    zb[i] = (g.x + g.y) / R2 * COS;
  }
  groundZ.set(zb);
  // road band crossing stripes: inset, never floating
  roadStripes(-1.5, 1.5, 7);
  // stall: counter anchored to ground, roof on 2 posts, crate touching counter
  const cx = STALL.x, cy = STALL.y;
  box(cx - 1.6, cy - 0.7, 0, cx + 1.6, cy + 0.7, 1.1, [150, 100, 66], 4);
  castShadow(cx, cy, 1.1, 1.6);
  box(cx - 1.9, cy - 1.0, 2.4, cx + 1.9, cy + 1.0, 2.6, [168, 84, 62], 9); // roof slab
  for (const [px, py] of [[cx - 1.7, cy - 0.9], [cx + 1.7, cy + 0.9]]) {
    capsule([px, py, 1.1], [px, py, 2.5], 0.09, 0.09, () => [104, 80, 54], 'solid');
    castShadow(px, py, 2, 0.25);
  }
  box(cx - 2.6, cy + 1.2, 0, cx - 1.9, cy + 1.9, 0.6, [150, 118, 82], 7); // crate touches stall
  castShadow(cx - 2.25, cy + 1.55, 0.6, 0.5);
  // lantern pole + arm: two-point hang
  capsule([cx + 2.6, cy - 1.4, 0], [cx + 2.6, cy - 1.4, 3.1], 0.08, 0.08, () => [80, 64, 48], 'solid');
  capsule([cx + 2.6, cy - 1.4, 3.1], [cx + 1.6, cy - 1.0, 3.0], 0.05, 0.05, () => [80, 64, 48], 'solid');
  castShadow(cx + 2.6, cy - 1.4, 3, 0.4);
  bakeOcclusion();
  staticShadow.set(shadowMask);
  applyShadows(groundZ);
  bakedPix.set(pix); bakedZ.set(zb);
}

function draw() {
  pix.set(bakedPix); zb.set(bakedZ); pendingShadows.length = 0;
  const t = G.time, wt = windTime(G.time);
  const beat = Math.floor(((t % LOOP_LEN) / LOOP_LEN) * 4);
  // hero runner: wraps across the road, 4-key gait
  const rx = ((0 + t * FLOW) % SPAN + SPAN) % SPAN - SPAN / 2;
  const rp = walkPose(t, { swing: 0.13, armSwing: 3 });
  const rYaw = Math.round(-0.78 / 0.35) * 0.35;
  figure(rx, 1.5, rYaw, rp, RUNNER, dynamicAdd);
  const hp = project(rx, 1.5, 2.1);
  spikyHair(rx, 1.5, 2.1, RUNNER.hair, 0.9);
  headband(rx, 1.5, 2.1, t);
  // vendor behind counter: flip peaks on beats 1 and 3
  const flip = (beat === 1 || beat === 3) ? 2.0 : 1.3;
  figure(STALL.x, STALL.y - 0.2, 1.57, { scale: 0.95, crouch: 0.15, lean: 0.15, stance: 0.08, armR: flip, armL: 0.4 }, VENDOR, dynamicAdd);
  // lantern sway from pole arm tip
  const sway = loopSin(t, 1.2) * 0.15;
  capsule([STALL.x + 1.6, STALL.y - 1.0, 3.0], [STALL.x + 1.6 + sway, STALL.y - 1.0, 2.4], 0.03, 0.03, () => [60, 56, 52], 'solid');
  sphere(STALL.x + 1.6 + sway, STALL.y - 1.0, 2.2, 0.22, [255, 190, 120], 'gloss');
  drawLeaves(wt); drawTufts(wt);
  flushShadows(); applyShadows(bakedZ); shadeEdges();
  // dust puff under runner on contact beats 0 and 2
  if (beat === 0 || beat === 2) {
    const p = project(rx, 1.5, 0.1);
    drawDots([[p.sx - 2, p.sy], [p.sx + 2, p.sy - 1], [p.sx, p.sy - 2]], rgb(220, 210, 200));
  }
  ctx.putImageData(image, 0, 0);
}

function update(dt) { G.time += dt; }

const recBtn = document.getElementById('rec');
let recorder = null;
recBtn.addEventListener('click', () => {
  if (recorder) { recorder.stop(); return; }
  const stream = canvas.captureStream(30);
  const chunks = [];
  recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'street-runner-loop.webm'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    recorder = null; recBtn.textContent = 'record webm';
  };
  recorder.start();
  recBtn.textContent = 'recording… (one loop)';
  setTimeout(() => { if (recorder && recorder.state !== 'inactive') recorder.stop(); }, LOOP_LEN * 1000);
});
document.getElementById('png').addEventListener('click', () => {
  const out = document.createElement('canvas');
  out.width = W * 3; out.height = H * 3;
  const o = out.getContext('2d');
  o.imageSmoothingEnabled = false;
  o.drawImage(canvas, 0, 0, out.width, out.height);
  const a = document.createElement('a');
  a.download = 'street-runner.png';
  a.href = out.toDataURL(); a.click();
});

addEventListener('resize', fit);
fit(); bake(); draw();
let last = performance.now();
function frame(now) {
  update(Math.min(0.04, (now - last) / 1000));
  last = now; draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__loop = { G, LOOP_LEN, step(dt, skipDraw) { update(dt); if (!skipDraw) draw(); } };
</script>
</body>
</html>
